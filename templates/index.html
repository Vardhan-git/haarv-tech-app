<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Haarv Tech — AI Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
</head>
<body>

<nav id="nav">
  <div class="nav-logo-text">Haarv Tech</div>
  <button class="btn-gs">Get Started</button>
</nav>

<div class="hero">

  <div class="greet-wrap" id="greetWrap">
    <span class="greet-icon" id="gi"></span>
    <div class="greet-text" id="greetText"></div>
  </div>

  <div class="sbox" id="sbox">
    <div class="sbar">
      <input class="sinput" id="searchInput" type="text" placeholder="Ask anything..."/>
      <button class="sbtn" id="searchBtn">→</button>
    </div>
  </div>

  <!-- TOOL ICONS -->
  <div class="tools-row" id="toolsRow">
    <div class="tool-icon" title="Study Buddy" onclick="window.location.href='/study-buddy'">
  <i class="ti ti-messages"></i>
</div>
    <div class="tool-icon" title="Quiz Generator">
      <i class="ti ti-brain"></i>
    </div>
    <div class="tool-icon" title="Code Debugger">
      <i class="ti ti-bug"></i>
    </div>
    <div class="tool-icon" title="Lesson Planner">
      <i class="ti ti-file-text"></i>
    </div>
    <div class="tool-icon" title="Code Explainer">
      <i class="ti ti-zoom-code"></i>
    </div>
    <div class="tool-icon" title="Concept Simplifier">
      <i class="ti ti-bulb"></i>
    </div>
    <div class="tool-icon" title="Assignment Generator">
      <i class="ti ti-clipboard-list"></i>
    </div>
    <div class="tool-icon" title="PDF Export">
      <i class="ti ti-file-download"></i>
    </div>
  </div>

  <!-- ANSWER AREA -->
  <div class="answer-wrap" id="answerWrap">
    <div class="answer-box">
      <div class="answer-header">
        <div class="answer-avatar">HT</div>
        <div class="answer-label">Haarv Tech AI</div>
        <div class="answer-status" id="answerStatus">Thinking...</div>
      </div>
      <div class="answer-content" id="answerContent"></div>
    </div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
