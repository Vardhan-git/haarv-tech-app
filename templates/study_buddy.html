<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Buddy — Haarv Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;overflow:hidden;
      font-family:'Inter',sans-serif;
      background:radial-gradient(ellipse 120% 100% at 50% 0%,#0d0d1a 0%,#0a0a14 40%,#080810 100%);
    }

    /* AURORA */
    .aurora{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%,rgba(108,99,255,.15) 0%,transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 20%,rgba(37,99,235,.12) 0%,transparent 70%),
        radial-gradient(ellipse 70% 50% at 50% 80%,rgba(167,139,250,.1) 0%,transparent 70%);
      animation:auroraPulse 6s ease infinite;
    }
    @keyframes auroraPulse{0%,100%{opacity:.7}50%{opacity:1}}

    /* NEURAL CANVAS */
    canvas{position:fixed;inset:0;z-index:1;pointer-events:none}

    /* HERO */
    .hero{
      position:relative;z-index:10;
      width:100%;height:100vh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
    }

    /* BOOK CONTAINER */
    .book-container{
      position:relative;
      display:flex;align-items:center;justify-content:center;
      width:40vw;max-width:480px;min-width:280px;
      opacity:0;
      animation:fadeUp 1s ease forwards .5s;
    }

    /* GLOW BEHIND BOOK */
    .book-glow{
      position:absolute;
      width:100%;height:100%;
      border-radius:50%;
      background:radial-gradient(circle,rgba(124,111,255,.35) 0%,rgba(37,99,235,.15) 40%,transparent 70%);
      filter:blur(24px);
      animation:glowBreathe 4s ease-in-out infinite;
      z-index:0;
      transform:scale(1.3);
    }
    @keyframes glowBreathe{
      0%,100%{opacity:.6;transform:scale(1.3)}
      50%{opacity:1;transform:scale(1.5)}
    }

   .book-img{
  position:relative;z-index:2;
  width:100%;
  object-fit:contain;
  filter:drop-shadow(0 0 32px rgba(124,111,255,.5)) drop-shadow(0 0 64px rgba(37,99,235,.3));
  animation:bookFloat 4s ease-in-out infinite;
  mix-blend-mode:screen;
}
    @keyframes bookFloat{
      0%,100%{transform:translateY(0px)}
      50%{transform:translateY(-16px)}
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(30px)}
      to{opacity:1;transform:translateY(0)}
    }
  </style>
</head>
<body>

<div class="aurora"></div>
<canvas id="c"></canvas>

<div class="hero">
  <div class="book-container">
    <div class="book-glow"></div>
    <img
      src="{{ url_for('static', filename='images/knowledgebook.png') }}"
      class="book-img"
      alt="Knowledge Book"
    />
  </div>
</div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
function rs(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
rs();window.addEventListener('resize',rs);
const nodes=[];
for(let i=0;i<55;i++) nodes.push({
  x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,
  vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
  r:Math.random()*1.5+.5,op:Math.random()*.12+.03,
  col:Math.random()>.5?'124,111,255':'37,99,235'
});
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){
        cx.globalAlpha=.06*(1-d/130);
        cx.strokeStyle='rgba(124,111,255,1)';cx.lineWidth=.5;
        cx.beginPath();cx.moveTo(nodes[i].x,nodes[i].y);cx.lineTo(nodes[j].x,nodes[j].y);cx.stroke();
      }
    }
  }
  nodes.forEach(n=>{
    cx.globalAlpha=n.op;
    cx.beginPath();cx.arc(n.x,n.y,n.r,0,Math.PI*2);
    cx.fillStyle=`rgba(${n.col},1)`;cx.fill();
    n.x+=n.vx;n.y+=n.vy;
    if(n.x<0)n.x=cv.width;if(n.x>cv.width)n.x=0;
    if(n.y<0)n.y=cv.height;if(n.y>cv.height)n.y=0;
  });
  cx.globalAlpha=1;requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
